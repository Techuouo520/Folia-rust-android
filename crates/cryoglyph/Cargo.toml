# cryoglyph 0.1.0 from crates.io (MIT OR Apache-2.0 OR Zlib), patched in for one shader change: see PATCH.md.
[package]
edition = "2024"
name = "cryoglyph"
version = "0.1.0"
authors = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
description = "Fast, simple 2D text rendering for wgpu. A fork of glyphon for iced."
readme = "README.md"
license = "MIT OR Apache-2.0 OR Zlib"
repository = "https://github.com/iced-rs/cryoglyph"
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "cryoglyph"
path = "src/lib.rs"

[dependencies.cosmic-text]
version = "0.15"

[dependencies.etagere]
version = "0.2"

[dependencies.lru]
version = "0.16"
default-features = false

[dependencies.rustc-hash]
version = "2"

[dependencies.wgpu]
version = "27"
features = ["wgsl"]
default-features = false
