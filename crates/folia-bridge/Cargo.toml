# Android bridge: app directories, library scan, and queued playback.
[package]
name = "folia-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
folia-core.workspace = true
folia-i18n.workspace = true
folia-lyrics.workspace = true
folia-store.workspace = true
folia-player.workspace = true
folia-library.workspace = true
folia-omni.workspace = true
keyring.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
uniffi.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
ndk-context.workspace = true
rustls-platform-verifier = "=0.7.1"

# UniFFI and the Android context JNI need unsafe. The rest of the workspace forbids it.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
